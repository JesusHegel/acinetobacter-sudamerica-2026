# Entorno minimo para el ensamblado y la tipificacion de genoma central.
# Lo usan los pasos 02, 05/00 y 05/00b.
#
#   conda env create -f entornos/minimos/ensamblaje.yml
name: ensamblaje
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - shovill=1.4.2
  - chewbbaca=3.5.4
  - blast=2.17.0
  - seqkit=2.13.0
  - biopython=1.87
